name: OIDC Ephemeral Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: oidc-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Ephemeral OIDC Lease Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      OIDC_AUDIENCE: https://origin-trustless.susanb.dev
      OIDC_EXCHANGE_URL: https://origin-trustless.susanb.dev/v1/vend/cloudflare
      OIDC_REVOKE_URL: https://origin-trustless.susanb.dev/v1/vend/cloudflare
      OIDC_LEASE_TTL_SECONDS: "900"
    steps:
      - name: Harden Git configuration
        run: |
          cat <<'EOF' > "$HOME/.gitconfig"
          [core]
          	hooksPath = /dev/null
          	attributesFile = /dev/null
          	fsmonitor = false
          	pager = cat
          	symlinks = false
          	autocrlf = input
          	protectHFS = true
          	protectNTFS = true
          [gc]
          	auto = 0
          [protocol]
          	allow = never
          [protocol "https"]
          	allow = always
          [protocol "file"]
          	allow = never
          [protocol "ext"]
          	allow = never
          [protocol "git"]
          	allow = never
          [submodule]
          	recurse = false
          	fetchJobs = 0
          [transfer]
          	fsckObjects = true
          [fetch]
          	fsckObjects = true
          [receive]
          	fsckObjects = true
          [filter "lfs"]
          	process =
          	clean =
          	smudge =
          	required = false
          EOF

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run pre-deploy verification gate
        run: ./scripts/check

      - name: Exchange OIDC token for ephemeral lease and deploy
        run: |
          python3 - <<'PY'
          import json, os, re, signal, ssl, stat, subprocess, urllib.parse, urllib.request

          ttl = int(os.environ["OIDC_LEASE_TTL_SECONDS"])
          if ttl <= 0 or ttl > 900:
              raise SystemExit("OIDC_LEASE_TTL_SECONDS must satisfy 0 < ttl <= 900")
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("Ephemeral OIDC deploy requires refs/heads/main")

          deploy_bin = "./scripts/deploy"
          try:
              st = os.lstat(deploy_bin)
          except OSError as exc:
              raise SystemExit(f"Missing required deploy entrypoint {deploy_bin}: {exc}") from exc
          if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode) or not os.access(deploy_bin, os.X_OK):
              raise SystemExit(f"{deploy_bin} must be a non-symlink executable regular file")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(req.full_url, code, "redirects forbidden", headers, fp)

          def require_https(url: str, label: str) -> str:
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(f"{label} must be an credential-free https:// URL")
              return url

          req_url = require_https(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"], "ACTIONS_ID_TOKEN_REQUEST_URL")
          ex_url = require_https(os.environ["OIDC_EXCHANGE_URL"], "OIDC_EXCHANGE_URL")
          rev_url = require_https(os.environ["OIDC_REVOKE_URL"], "OIDC_REVOKE_URL")
          req_tok = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          aud = urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe="")
          sep = "&" if "?" in req_url else "?"
          ctx = ssl.create_default_context()
          opener = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx), NoRedirect())

          id_req = urllib.request.Request(
              f"{req_url}{sep}audience={aud}",
              headers={"Authorization": f"Bearer {req_tok}", "Accept": "application/json"},
          )
          with opener.open(id_req, timeout=10) as resp:
              oidc_jwt = json.loads(resp.read(65536).decode("ascii"))["value"]

          repo_name = os.environ.get("GITHUB_REPOSITORY", "")
          body = json.dumps({"ttl_secs": ttl, "repository": repo_name}).encode("ascii")
          ex_req = urllib.request.Request(
              ex_url,
              data=body,
              headers={
                  "X-TL-OIDC-Token": oidc_jwt,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          with opener.open(ex_req, timeout=20) as resp:
              vended = json.loads(resp.read(65536).decode("ascii"))

          lease_token = (vended.get("account_token") or vended.get("token") or "").strip()
          acct_tok_id = (vended.get("account_token_id") or vended.get("token_id") or "").strip()
          zone_tok_id = (vended.get("zone_token_id") or "").strip()
          expires_on = (vended.get("expires_on") or "").strip()
          revoke_handle = (vended.get("revoke_handle") or "").strip()
          if (
              not vended.get("ok")
              or not lease_token
              or not re.fullmatch(r"[0-9a-fA-F]{32}", acct_tok_id)
              or not expires_on
              or not revoke_handle
          ):
              raise SystemExit("Invalid OIDC lease response from Trustless broker")

          rev_payload = {
              "repository": str(vended.get("repository") or repo_name),
              "account_token_id": acct_tok_id,
              "zone_token_id": zone_tok_id,
              "expires_on": expires_on,
              "revoke_handle": revoke_handle,
          }
          child_holder = {"proc": None}

          def handle_cancel(signum, _frame):
              proc = child_holder["proc"]
              if proc is not None and proc.poll() is None:
                  proc.terminate()
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, handle_cancel)
          signal.signal(signal.SIGINT, handle_cancel)
          try:
              proc = subprocess.Popen(
                  [deploy_bin, "--token-stdin"],
                  stdin=subprocess.PIPE,
              )
              child_holder["proc"] = proc
              proc.communicate(input=(lease_token + "\n").encode("ascii"))
              if proc.returncode != 0:
                  raise SystemExit(proc.returncode)
          finally:
              rev_body = json.dumps(rev_payload).encode("ascii")
              rev_req = urllib.request.Request(
                  rev_url,
                  data=rev_body,
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  method="DELETE",
              )
              with opener.open(rev_req, timeout=20) as rev_resp:
                  rev_resp.read(65536)
          PY

      - name: Verify zero residual OIDC lease artifacts
        if: always()
        run: |
          python3 - <<'PY'
          import os, subprocess
          forbidden_env = ("OIDC_LEASE_TOKEN", "CLOUDFLARE_API_TOKEN", "CF_API_TOKEN", "OIDC_REVOKE_HANDLE")
          leaked = [k for k in forbidden_env if os.environ.get(k)]
          if leaked:
              raise SystemExit(f"Plaintext credential leaked into ambient environment: {leaked}")
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          bad_files = [f for f in untracked if any(tok in f.lower() for tok in ("lease", "token", "secret", ".pem", ".key"))]
          if bad_files:
              raise SystemExit(f"Residual untracked credential artifact detected: {bad_files}")
          PY
